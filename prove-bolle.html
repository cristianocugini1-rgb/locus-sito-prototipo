<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locus · prove delle bolle</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2b0d0c; color: #F5E4CB; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
    .lab { position: fixed; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 2; width: 210px; }
    .lab b { display: block; font: 600 14px/1.2 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .lab span { display: block; margin-top: 4px; font-size: 12px; opacity: .7; line-height: 1.4; }
    #aiuto { position: fixed; left: 0; right: 0; top: 16px; text-align: center; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; opacity: .55; z-index: 2; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="aiuto">clic su una bolla per vederla grande · clic di nuovo per tornare</div>
  <script type="module" src="/src/prove-bolle.js"></script>
</body>
</html>
