<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locus · prove di colore degli anelli</title>
  <style>
    html, body { margin: 0; height: 100%; background: #24090a; color: #F5E4CB; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
    #ui { position: fixed; left: 0; right: 0; top: 14px; display: flex; justify-content: center; gap: 10px; z-index: 2; }
    #ui button { background: rgba(20, 4, 4, .5); color: #F5E4CB; border: 1px solid rgba(245, 228, 203, .3); padding: 10px 16px; font: 12px/1 Inter, sans-serif; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
    #ui button.on { background: #F5E4CB; color: #24090a; }
    .lab { position: fixed; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 2; width: 260px; }
    .lab b { display: block; font: 600 14px/1.2 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .lab span { display: block; margin-top: 3px; font-size: 12px; opacity: .6; }
    .lab i { display: block; margin-top: 3px; font-size: 12px; font-style: normal; opacity: .8; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="ui"></div>
  <script type="module" src="/src/prove-colori.js"></script>
</body>
</html>
