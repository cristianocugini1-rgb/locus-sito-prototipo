<body>
  <canvas id="gl"></canvas>

  <div class="ui">
    <!-- apertura -->
    <section class="layer hero" id="l-hero">
      <h1 class="title hero-title">Riempi<br />il vuoto.</h1>
      <p class="hint" id="hint">tocca la bolla, oppure scorri</p>

    <!-- accanto alla L: chi ha fretta salta tutta l'introduzione -->
    <a class="layer salta" id="l-salta" href="chi-siamo.html" data-dissolve>vai dritto a Chi siamo <i>&rarr;</i></a>

    <section class="layer ring-label" id="l-r2">

    </section>
    <section class="layer ring-label" id="l-r3">
      <h2 class="title">Costruisci.</h2>
    </section>

    <!-- nastro di foto -->
    <section class="layer gallery-label" id="l-gal"></section>

    <!-- il Battistero di grani -->
    <section class="layer batt-label" id="l-batt">
      <h2 class="title small">Il nostro<br />posto.</h2>
    </section>

    <!-- chiusura -->
    <section class="layer closing" id="l-end">
      <p class="motto">trova il tuo posto</p>
      <div class="gos"><a class="go" href="chi-siamo.html" data-dissolve>Chi siamo</a></div>
