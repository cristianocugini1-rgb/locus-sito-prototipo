<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locus · prove dei cerchi</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d0707; color: #F5E4CB; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; z-index: 2; }
    #ui button { background: rgba(20, 4, 4, .5); color: #F5E4CB; border: 1px solid rgba(245, 228, 203, .3); padding: 10px 16px; font: 12px/1 Inter, sans-serif; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
    #ui button.on { background: #F5E4CB; color: #1d0707; }
    #name { position: fixed; top: 28px; left: 0; right: 0; text-align: center; z-index: 2; }
    #name b { display: block; font: 400 34px/1.1 'Anton', Impact, sans-serif; letter-spacing: .02em; text-transform: uppercase; }
    #name span { display: block; margin-top: 8px; font-size: 14px; opacity: .75; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="name"><b></b><span></span></div>
  <div id="ui"></div>
  <script type="module" src="/src/prove-cerchi.js"></script>
</body>
</html>
