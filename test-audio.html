<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locus · Prova del suono</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #140404; color: #F5E4CB; font-family: system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    button { background: #800200; color: #F5E4CB; border: 0; padding: 16px 28px; font-size: 16px; cursor: pointer; }
    #meter { width: 320px; height: 10px; background: #2b0d0c; }
    #bar { height: 100%; width: 0; background: #ECFE02; }
    pre { font-size: 13px; opacity: .8; }
  </style>
</head>
<body>
  <h2>Prova del suono</h2>
  <button id="tone">1. Suona un La per 2 secondi</button>
  <button id="ambient">2. Avvia la musica del sito</button>
  <div id="meter"><div id="bar"></div></div>
  <pre id="info">Clicca un pulsante.</pre>
  <script type="module">
    import { Ambient } from './src/audio.js';
    const info = document.getElementById('info');
    const bar = document.getElementById('bar');
    let ctx, an;
    function meter(c, node) {
      an = c.createAnalyser(); an.fftSize = 2048; node.connect(an);
      const d = new Float32Array(an.fftSize);
      (function loop() {
        an.getFloatTimeDomainData(d);
        let m = 0; for (const v of d) m = Math.max(m, Math.abs(v));
        bar.style.width = Math.min(100, m * 100) + '%';
        info.textContent = `stato audio: ${c.state}\nfrequenza: ${c.sampleRate} Hz\nlivello: ${(m * 100).toFixed(0)}%`;
        requestAnimationFrame(loop);
      })();
    }
    document.getElementById('tone').onclick = async () => {
      ctx = ctx || new AudioContext();
      await ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 440; g.gain.value = 0.3;
      o.connect(g).connect(ctx.destination);
      meter(ctx, g);
      o.start(); o.stop(ctx.currentTime + 2);
    };
    document.getElementById('ambient').onclick = () => {
      const a = new Ambient(); a.start();
      meter(a.ctx, a.out);
    };
  </script>
</body>
</html>
